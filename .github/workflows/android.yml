name: Build Android APK from Web Design

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Récupérer le code du dépôt (le fichier ZIP)
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Configurer Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 3. Configurer Java 21 (Nécessaire pour les versions récentes du build Android)
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    # 4. Décompresser vos fichiers de design et préparer l'arborescence
    - name: Unzip project files
      run: |
        unzip -o niswo.zip
        
        # Trouver où se trouve le fichier index.html extrait
        EXTRACTED_DIR=$(find . -name "index.html" -exec dirname {} \; | head -n 1)
        if [ -z "$EXTRACTED_DIR" ]; then
          EXTRACTED_DIR="."
        fi
        
        # Créer un dossier de travail propre pour éviter les conflits Capacitor
        mkdir -p build_workspace/www
        
        # Copier tout le contenu du design dans le sous-dossier www
        cp -r $EXTRACTED_DIR/* build_workspace/www/ 2>/dev/null || true
        
        # Supprimer le zip du dossier de travail pour éviter les boucles de copie
        rm -f build_workspace/www/niswo.zip
        
        echo "WORKSPACE_PATH=$GITHUB_WORKSPACE/build_workspace" >> $GITHUB_ENV

    # 5. Transformer le code de design en projet Android avec Capacitor
    - name: Initialize Mobile Platform
      run: |
        cd ${{ env.WORKSPACE_PATH }}
        
        # Créer un package.json standard
        npm init -y
        
        # Installer Capacitor
        npm install @capacitor/core @capacitor/cli
        
        # Initialiser le projet avec le dossier webDir pointant explicitement sur "www"
        npx cap init NiswoApp com.niswo.app --web-dir=www
        
        # Installer et ajouter la plateforme Android
        npm install @capacitor/android
        npx cap add android
        
        # Synchroniser les fichiers du dossier www vers le projet Android natif
        npx cap sync

    # 6. Compiler l'APK Android final
    - name: Build APK with Gradle
      run: |
        cd ${{ env.WORKSPACE_PATH }}/android
        chmod +x ./gradlew
        ./gradlew assembleDebug

    # 7. Rendre l'APK disponible au téléchargement
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          **/android/app/build/outputs/apk/debug/*.apk
