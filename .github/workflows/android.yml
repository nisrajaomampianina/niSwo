name: Build Android APK

# Déclenche le workflow à chaque push sur la branche principale (main ou master)
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Récupérer le code du dépôt
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Configurer le JDK (Java Development Kit) requis pour Android
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 3. Donner les permissions d'exécution au script Gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. Compiler l'APK en mode Debug (ou Release)
    - name: Build with Gradle
      run: ./gradlew assembleDebug

    # 5. Sauvegarder l'APK généré pour pouvoir le télécharger
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
