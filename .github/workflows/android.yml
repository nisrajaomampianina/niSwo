name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Récupérer le fichier zip du dépôt
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Décompresser le fichier niswo.zip
    - name: Unzip project files
      run: |
        unzip -o niswo.zip
        echo "=== Structure des dossiers après extraction ==="
        ls -R

    # 3. Configurer l'environnement Java requis
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    # 4. Trouver le fichier gradlew, lui donner les permissions et compiler
    - name: Build with Gradle
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" -print -quit)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Erreur : Le fichier gradlew est introuvable dans le ZIP !"
          exit 1
        fi
        GRADLEW_DIR=$(dirname "$GRADLEW_PATH")
        echo "Fichier gradlew trouvé dans : $GRADLEW_DIR"
        cd "$GRADLEW_DIR"
        chmod +x ./gradlew
        ./gradlew assembleDebug

    # 5. Sauvegarder tous les APK générés pour le téléchargement
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          **/build/outputs/apk/debug/*.apk
