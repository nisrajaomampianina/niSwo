name: Build Android APK from Web Design

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Récupérer le code du dépôt (le fichier ZIP)
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Configurer Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 3. Configurer Java 21
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    # 4. Décompresser vos fichiers de design et préparer l'arborescence
    - name: Unzip project files
      run: |
        unzip -o niswo.zip
        
        # Trouver où se trouve le fichier index.html extrait
        EXTRACTED_DIR=$(find . -name "index.html" -exec dirname {} \; | head -n 1)
        if [ -z "$EXTRACTED_DIR" ]; then
          EXTRACTED_DIR="."
        fi
        
        # Créer un dossier de travail propre
        mkdir -p build_workspace/www
        
        # Copier tout le contenu du design dans le sous-dossier www
        cp -r $EXTRACTED_DIR/* build_workspace/www/ 2>/dev/null || true
        rm -f build_workspace/www/niswo.zip
        
        echo "WORKSPACE_PATH=$GITHUB_WORKSPACE/build_workspace" >> $GITHUB_ENV

    # 5. Transformer le code de design en projet Android avec Capacitor
    - name: Initialize Mobile Platform
      run: |
        cd ${{ env.WORKSPACE_PATH }}
        npm init -y
        npm install @capacitor/core @capacitor/cli
        
        # CHANGER LE NOM ICI : Remplacez "Mon Super Nom" par le nom de votre choix
        npx cap init "Discipline by niS" com.niswo.app --web-dir=www
        
        npm install @capacitor/android
        npx cap add android

    # 6. Générer automatiquement toutes les tailles d'icônes Android
    - name: Generate App Icons and Splash Screens
      run: |
        cd ${{ env.WORKSPACE_PATH }}
        
        # Vérifier si l'utilisateur a fourni les images nécessaires
        if [ -f "www/icon.png" ]; then
          cp www/icon.png ./icon.png
          cp www/splash.png ./splash.png 2>/dev/null || cp www/icon.png ./splash.png
          
          # Installer l'outil de génération d'icônes officiel de Capacitor
          npm install @capacitor/assets --save-dev
          
          # Générer toutes les icônes requises pour Android
          npx capacitor-assets generate --android
          echo "Icônes personnalisées générées avec succès !"
        else
          echo "Attention : icon.png introuvable dans le ZIP. Utilisation des icônes par défaut."
        fi

    # 7. Synchroniser les ressources générées vers le projet natif
    - name: Sync Capacitor Projects
      run: |
        cd ${{ env.WORKSPACE_PATH }}
        npx cap sync

    # 8. Résoudre le conflit de doublons Kotlin (Duplicate class)
    - name: Fix Kotlin Duplicate Classes
      run: |
        BUILD_GRADLE_PATH="${{ env.WORKSPACE_PATH }}/android/app/build.gradle"
        sed -i '/dependencies {/a \    modules {\n        module("org.jetbrains.kotlin:kotlin-stdlib-jdk7") { replacedBy("org.jetbrains.kotlin:kotlin-stdlib") }\n        module("org.jetbrains.kotlin:kotlin-stdlib-jdk8") { replacedBy("org.jetbrains.kotlin:kotlin-stdlib") }\n    }' $BUILD_GRADLE_PATH

    # 9. Compiler l'APK Android final
    - name: Build APK with Gradle
      run: |
        cd ${{ env.WORKSPACE_PATH }}/android
        chmod +x ./gradlew
        ./gradlew assembleDebug

    # 10. Rendre l'APK disponible au téléchargement
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          **/android/app/build/outputs/apk/debug/*.apk
